<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pegaxus</title>
    <script>
      (function () {
        try {
          var matcher = window.matchMedia('(prefers-color-scheme: dark)');
          function updateFavicon() {
            var isDark = matcher.matches;
            var links = document.querySelectorAll('link[rel*="icon"]');
            links.forEach(function (link) {
              if (link.getAttribute('media')) return;
              link.href = isDark ? '/favicon-dark.png' : '/favicon-light.png';
            });
          }
          if (matcher.addEventListener) {
            matcher.addEventListener('change', updateFavicon);
          } else if (matcher.addListener) {
            matcher.addListener(updateFavicon);
          }
          updateFavicon();
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

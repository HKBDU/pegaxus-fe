name: Quality

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  conventions:
    name: Repository conventions
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          branch_pattern='^(dev|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+([._-][a-z0-9]+)*)$'
          title_pattern='^(dev|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+)'

          [[ "$BRANCH" =~ $branch_pattern ]] || {
            echo "Invalid branch name: $BRANCH"
            exit 1
          }

          [[ "$TITLE" =~ $title_pattern ]] || {
            echo "Invalid pull request title: $TITLE"
            exit 1
          }

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
